<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFCF7"/>
      <stop offset="0.55" stop-color="#FBF6EA"/>
      <stop offset="1" stop-color="#FDFBF3"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF3C2" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#FFE9A0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFE9A0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#FFE9B0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFE9B0" stop-opacity="0"/>
    </radialGradient>

    <filter id="blob" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="blobMd" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- ============ 弥散光斑 ============ -->
  <g filter="url(#blob)">
    <ellipse cx="220" cy="120" rx="420" ry="320" fill="#FFD84D" opacity="0.55"/>
    <ellipse cx="1620" cy="180" rx="400" ry="300" fill="#FFB48A" opacity="0.5"/>
    <ellipse cx="1720" cy="900" rx="440" ry="320" fill="#C9BFFF" opacity="0.5"/>
    <ellipse cx="180" cy="920" rx="420" ry="300" fill="#9FE0CE" opacity="0.5"/>
    <ellipse cx="960" cy="500" rx="500" ry="340" fill="#A6D6FF" opacity="0.35"/>
  </g>

  <!-- 柔光太阳 -->
  <circle cx="470" cy="250" r="340" fill="url(#sun)"/>

  <!-- ============ 柔光光束 ============ -->
  <g opacity="0.5">
    <path d="M470 250 L300 1080 L520 1080 Z" fill="#FFE9A0" opacity="0.12"/>
    <path d="M470 250 L700 1080 L900 1080 Z" fill="#FFC7B0" opacity="0.10"/>
  </g>

  <!-- ============ 漂浮柔光粒子 ============ -->
  <g filter="url(#blobMd)">
    <circle cx="820" cy="240" r="30" fill="#FFD98A" opacity="0.85"/>
    <circle cx="1240" cy="200" r="22" fill="#FFC7B0" opacity="0.8"/>
    <circle cx="1500" cy="300" r="16" fill="#A8D9FF" opacity="0.75"/>
    <circle cx="360" cy="440" r="18" fill="#CFC3FF" opacity="0.75"/>
    <circle cx="1180" cy="520" r="14" fill="#A9E8D7" opacity="0.75"/>
    <circle cx="1560" cy="620" r="26" fill="#FFD98A" opacity="0.7"/>
    <circle cx="620" cy="700" r="20" fill="#FFC9E0" opacity="0.7"/>
    <circle cx="1000" cy="820" r="22" fill="#CFC3FF" opacity="0.7"/>
    <circle cx="300" cy="760" r="18" fill="#A8D9FF" opacity="0.7"/>
  </g>

  <!-- 光晕圆环 -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.35">
    <circle cx="1500" cy="220" r="90" stroke-width="2"/>
    <circle cx="1500" cy="220" r="120" stroke-width="1.5"/>
  </g>
  <circle cx="1500" cy="220" r="26" fill="url(#orb)"/>
</svg>
