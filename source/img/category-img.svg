<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice" width="1600" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEFCFB"/>
      <stop offset="1" stop-color="#F4F3F8"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F3EEFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F3EEFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blob" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="blobSm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="600" fill="url(#bg)"/>

  <!-- 弥散光斑 -->
  <g filter="url(#blob)">
    <ellipse cx="200" cy="90" rx="420" ry="260" fill="#A8D9FF" opacity="0.55"/>
    <ellipse cx="1340" cy="120" rx="400" ry="260" fill="#FFC7B0" opacity="0.55"/>
    <ellipse cx="1480" cy="500" rx="420" ry="260" fill="#A9E8D7" opacity="0.48"/>
    <ellipse cx="120" cy="540" rx="400" ry="260" fill="#FFD84D" opacity="0.5"/>
  </g>

  <circle cx="430" cy="160" r="320" fill="url(#sun)"/>

  <!-- 文件夹树（左下：主文件夹 + 分支 + 子文件夹） -->
  <g opacity="0.15" fill="none" stroke="#1A1D29" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="150" y="405" width="160" height="115" rx="14" fill="#FFFFFF" fill-opacity="0.55"/>
    <path d="M150 430 L 200 430 L 225 405 L 150 405 Z" fill="#FFFFFF" fill-opacity="0.55"/>
    <line x1="310" y1="462" x2="360" y2="462"/>
    <line x1="360" y1="462" x2="360" y2="405"/>
    <line x1="360" y1="462" x2="360" y2="520"/>
    <rect x="360" y="380" width="120" height="62" rx="12" fill="#FFFFFF" fill-opacity="0.5"/>
    <path d="M360 395 L 392 395 L 408 380 L 360 380 Z" fill="#FFFFFF" fill-opacity="0.5"/>
    <rect x="360" y="505" width="120" height="62" rx="12" fill="#FFFFFF" fill-opacity="0.5"/>
    <path d="M360 520 L 392 520 L 408 505 L 360 505 Z" fill="#FFFFFF" fill-opacity="0.5"/>
  </g>

  <!-- 分类卡片组（右上） -->
  <g opacity="0.14" fill="#FFFFFF" stroke="#1A1D29" stroke-width="4">
    <rect x="1220" y="170" width="120" height="80" rx="14" fill-opacity="0.55"/>
    <rect x="1360" y="170" width="120" height="80" rx="14" fill-opacity="0.55"/>
    <rect x="1220" y="270" width="120" height="80" rx="14" fill-opacity="0.55"/>
    <rect x="1360" y="270" width="120" height="80" rx="14" fill-opacity="0.55"/>
  </g>
  <g opacity="0.16" fill="none" stroke="#1A1D29" stroke-width="3" stroke-linecap="round">
    <line x1="1236" y1="196" x2="1324" y2="196"/>
    <line x1="1376" y1="196" x2="1464" y2="196"/>
    <line x1="1236" y1="296" x2="1324" y2="296"/>
    <line x1="1376" y1="296" x2="1464" y2="296"/>
  </g>

  <!-- 柔光粒子 -->
  <g filter="url(#blobSm)">
    <circle cx="700" cy="180" r="16" fill="#A8D9FF" opacity="0.8"/>
    <circle cx="560" cy="430" r="13" fill="#FFC7B0" opacity="0.8"/>
    <circle cx="880" cy="300" r="11" fill="#A9E8D7" opacity="0.75"/>
    <circle cx="1060" cy="180" r="9" fill="#CFC3FF" opacity="0.75"/>
  </g>
</svg>
