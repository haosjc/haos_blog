<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice" width="1600" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFCFB"/>
      <stop offset="1" stop-color="#F1F5FC"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EAF4FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#EAF4FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blob" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="blobSm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="600" fill="url(#bg)"/>

  <!-- 弥散光斑 -->
  <g filter="url(#blob)">
    <ellipse cx="200" cy="90" rx="420" ry="260" fill="#A8D9FF" opacity="0.6"/>
    <ellipse cx="1340" cy="120" rx="400" ry="260" fill="#CFC3FF" opacity="0.6"/>
    <ellipse cx="1480" cy="500" rx="420" ry="260" fill="#FFD84D" opacity="0.42"/>
    <ellipse cx="120" cy="540" rx="400" ry="260" fill="#FFC7B0" opacity="0.45"/>
  </g>

  <circle cx="430" cy="160" r="320" fill="url(#sun)"/>

  <!-- 浏览器窗口（右下，代码编辑器） -->
  <g opacity="0.16" fill="none" stroke="#1A1D29" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1160" y="330" width="360" height="230" rx="16" fill="#FFFFFF" fill-opacity="0.55" stroke-width="5"/>
    <line x1="1160" y1="368" x2="1520" y2="368" stroke-width="5"/>
    <circle cx="1188" cy="349" r="6" fill="#FF5E5B" stroke="none"/>
    <circle cx="1208" cy="349" r="6" fill="#FFC700" stroke="none"/>
    <circle cx="1228" cy="349" r="6" fill="#2BD9C4" stroke="none"/>
    <!-- 代码行（不同长度） -->
    <line x1="1186" y1="398" x2="1460" y2="398" stroke-width="5"/>
    <line x1="1186" y1="424" x2="1380" y2="424" stroke-width="5"/>
    <line x1="1208" y1="450" x2="1440" y2="450" stroke-width="5"/>
    <line x1="1208" y1="476" x2="1300" y2="476" stroke-width="5"/>
    <line x1="1186" y1="502" x2="1420" y2="502" stroke-width="5"/>
  </g>

  <!-- HTML 标签结构（左上） -->
  <g opacity="0.15" fill="none" stroke="#1A1D29" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
    <path d="M150 200 L 190 200 L 220 230 L 250 200 L 290 200"/>
    <path d="M150 280 L 190 280 L 220 250 L 250 280 L 290 280"/>
    <line x1="220" y1="230" x2="220" y2="250" stroke-width="4"/>
  </g>
  <text x="220" y="176" font-family="Space Grotesk, Menlo, monospace" font-size="34" font-weight="600" fill="#1A1D29" opacity="0.14" text-anchor="middle">html</text>

  <!-- CSS 花括号块（右上） -->
  <g opacity="0.14" fill="none" stroke="#1A1D29" stroke-linecap="round" stroke-width="4">
    <path d="M1330 180 C 1312 190 1312 210 1330 220"/>
    <path d="M1400 180 C 1418 190 1418 210 1400 220"/>
    <line x1="1346" y1="200" x2="1384" y2="200" stroke-width="4"/>
  </g>

  <!-- 柔光粒子 -->
  <g filter="url(#blobSm)">
    <circle cx="700" cy="180" r="16" fill="#A8D9FF" opacity="0.8"/>
    <circle cx="560" cy="430" r="13" fill="#CFC3FF" opacity="0.8"/>
    <circle cx="880" cy="300" r="11" fill="#FFD84D" opacity="0.75"/>
    <circle cx="1060" cy="180" r="9" fill="#FFC7B0" opacity="0.75"/>
  </g>
</svg>
