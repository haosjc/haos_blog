<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice" width="1600" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEFCFD"/>
      <stop offset="1" stop-color="#F4F1FA"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FDEFF6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FDEFF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blob" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="blobSm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="600" fill="url(#bg)"/>

  <!-- 弥散光斑 -->
  <g filter="url(#blob)">
    <ellipse cx="200" cy="90" rx="420" ry="260" fill="#FFC9E0" opacity="0.55"/>
    <ellipse cx="1340" cy="120" rx="400" ry="260" fill="#CFC3FF" opacity="0.55"/>
    <ellipse cx="1480" cy="500" rx="420" ry="260" fill="#A8D9FF" opacity="0.48"/>
    <ellipse cx="120" cy="540" rx="400" ry="260" fill="#A9E8D7" opacity="0.5"/>
  </g>

  <circle cx="430" cy="160" r="320" fill="url(#sun)"/>

  <!-- 实体标签（带穿绳孔，左下叠放） -->
  <g opacity="0.16" fill="none" stroke="#1A1D29" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(-7 250 460)">
      <rect x="168" y="360" width="160" height="200" rx="16" fill="#FFFFFF" fill-opacity="0.55"/>
      <circle cx="248" cy="386" r="10" stroke-width="4"/>
      <line x1="200" y1="438" x2="296" y2="438" stroke-width="4"/>
      <line x1="200" y1="468" x2="278" y2="468" stroke-width="4"/>
      <line x1="200" y1="498" x2="290" y2="498" stroke-width="4"/>
    </g>
    <g transform="rotate(5 340 500)">
      <rect x="258" y="420" width="130" height="160" rx="12" fill="#FFFFFF" fill-opacity="0.4"/>
      <circle cx="323" cy="444" r="8" stroke-width="4"/>
      <line x1="282" y1="486" x2="364" y2="486" stroke-width="4"/>
      <line x1="282" y1="512" x2="350" y2="512" stroke-width="4"/>
    </g>
  </g>

  <!-- 井号标签（右上） -->
  <text x="1350" y="200" font-family="Space Grotesk, Arial, sans-serif" font-size="150" font-weight="700" fill="#1A1D29" opacity="0.14" text-anchor="middle">#</text>
  <g opacity="0.14" fill="none" stroke="#1A1D29" stroke-width="4" stroke-linecap="round">
    <rect x="1180" y="240" width="340" height="70" rx="35" fill="#FFFFFF" fill-opacity="0.5"/>
    <text x="1350" y="287" font-family="Space Grotesk, Arial, sans-serif" font-size="30" font-weight="600" fill="#1A1D29" text-anchor="middle" stroke="none">TAG</text>
  </g>

  <!-- 柔光粒子 -->
  <g filter="url(#blobSm)">
    <circle cx="700" cy="180" r="16" fill="#FFC9E0" opacity="0.8"/>
    <circle cx="560" cy="430" r="13" fill="#CFC3FF" opacity="0.8"/>
    <circle cx="880" cy="300" r="11" fill="#A9E8D7" opacity="0.75"/>
    <circle cx="1060" cy="180" r="9" fill="#A8D9FF" opacity="0.75"/>
  </g>
</svg>
