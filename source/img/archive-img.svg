<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice" width="1600" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEFCF7"/>
      <stop offset="1" stop-color="#F7F3EA"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF3C9" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFF3C9" stop-opacity="0"/>
    </radialGradient>
    <filter id="blob" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="blobSm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="600" fill="url(#bg)"/>

  <!-- 弥散光斑 -->
  <g filter="url(#blob)">
    <ellipse cx="200" cy="90" rx="420" ry="260" fill="#FFD84D" opacity="0.55"/>
    <ellipse cx="1340" cy="120" rx="400" ry="260" fill="#FFC7B0" opacity="0.55"/>
    <ellipse cx="1480" cy="500" rx="420" ry="260" fill="#CFC3FF" opacity="0.45"/>
    <ellipse cx="120" cy="540" rx="400" ry="260" fill="#A9E8D7" opacity="0.45"/>
  </g>

  <circle cx="430" cy="160" r="320" fill="url(#sun)"/>

  <!-- 档案盒（文件柜抽屉，左下） -->
  <g opacity="0.15" fill="none" stroke="#1A1D29" stroke-width="4" stroke-linecap="round">
    <rect x="150" y="350" width="190" height="190" rx="16" fill="#FFFFFF" fill-opacity="0.55"/>
    <line x1="150" y1="408" x2="340" y2="408"/>
    <line x1="150" y1="466" x2="340" y2="466"/>
    <rect x="222" y="392" width="46" height="14" rx="7" stroke-width="3"/>
    <rect x="222" y="450" width="46" height="14" rx="7" stroke-width="3"/>
    <rect x="222" y="508" width="46" height="14" rx="7" stroke-width="3"/>
  </g>

  <!-- 时间线（右下） -->
  <g opacity="0.14" fill="none" stroke="#1A1D29" stroke-width="4">
    <line x1="1300" y1="370" x2="1300" y2="540" stroke-linecap="round"/>
  </g>
  <g opacity="0.16" fill="#FFFFFF" stroke="#1A1D29" stroke-width="3">
    <circle cx="1300" cy="395" r="9"/>
    <circle cx="1300" cy="455" r="9"/>
    <circle cx="1300" cy="515" r="9"/>
  </g>

  <!-- 日历（右上） -->
  <g opacity="0.15" fill="#FFFFFF" stroke="#1A1D29" stroke-width="4" stroke-linecap="round">
    <rect x="1220" y="140" width="100" height="90" rx="14" fill-opacity="0.55"/>
    <line x1="1220" y1="176" x2="1320" y2="176"/>
    <line x1="1245" y1="126" x2="1245" y2="152"/>
    <line x1="1295" y1="126" x2="1295" y2="152"/>
  </g>
  <g fill="#1A1D29" opacity="0.16">
    <circle cx="1245" cy="200" r="5"/>
    <circle cx="1270" cy="200" r="5"/>
    <circle cx="1295" cy="200" r="5"/>
    <circle cx="1245" cy="218" r="5"/>
    <circle cx="1270" cy="218" r="5"/>
  </g>

  <!-- 柔光粒子 -->
  <g filter="url(#blobSm)">
    <circle cx="700" cy="180" r="16" fill="#FFD84D" opacity="0.8"/>
    <circle cx="560" cy="430" r="13" fill="#FFC7B0" opacity="0.8"/>
    <circle cx="880" cy="300" r="11" fill="#A9E8D7" opacity="0.75"/>
    <circle cx="1060" cy="180" r="9" fill="#CFC3FF" opacity="0.75"/>
  </g>
</svg>
