<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice" width="1600" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEFCF8"/>
      <stop offset="1" stop-color="#F8F5EC"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF3C2" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFE9A0" stop-opacity="0"/>
    </radialGradient>
    <filter id="blob" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="blobSm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="600" fill="url(#bg)"/>

  <!-- 弥散光斑 -->
  <g filter="url(#blob)">
    <ellipse cx="200" cy="90" rx="420" ry="260" fill="#FFD84D" opacity="0.55"/>
    <ellipse cx="1340" cy="120" rx="400" ry="260" fill="#FFC7B0" opacity="0.55"/>
    <ellipse cx="1480" cy="500" rx="420" ry="260" fill="#CFC3FF" opacity="0.45"/>
    <ellipse cx="120" cy="540" rx="400" ry="260" fill="#A9E8D7" opacity="0.5"/>
  </g>

  <circle cx="430" cy="160" r="320" fill="url(#sun)"/>

  <!-- 名片（左下，含头像与信息） -->
  <g opacity="0.15" fill="none" stroke="#1A1D29" stroke-width="4" stroke-linecap="round">
    <rect x="150" y="385" width="230" height="140" rx="16" fill="#FFFFFF" fill-opacity="0.55"/>
    <circle cx="205" cy="438" r="26" fill="#FFFFFF" fill-opacity="0.6" stroke-width="4"/>
    <line x1="250" y1="415" x2="350" y2="415" stroke-width="4"/>
    <line x1="250" y1="442" x2="335" y2="442" stroke-width="4"/>
    <line x1="250" y1="469" x2="355" y2="469" stroke-width="3"/>
  </g>
  <!-- 名片右上角的小圆角标签（社交图标示意） -->
  <g opacity="0.14" fill="#FFFFFF" stroke="#1A1D29" stroke-width="3">
    <circle cx="355" cy="400" r="11" fill-opacity="0.6"/>
    <circle cx="375" cy="400" r="11" fill-opacity="0.6"/>
  </g>

  <!-- 手写签名（右上，波浪线） -->
  <path d="M1240 200 q 22 -26 44 0 t 44 0 t 44 0 t 44 0 t 44 0" fill="none" stroke="#1A1D29" stroke-width="4" stroke-linecap="round" opacity="0.14"/>

  <!-- 柔光粒子 -->
  <g filter="url(#blobSm)">
    <circle cx="700" cy="180" r="16" fill="#FFD84D" opacity="0.8"/>
    <circle cx="560" cy="430" r="13" fill="#FFC7B0" opacity="0.8"/>
    <circle cx="880" cy="300" r="11" fill="#A9E8D7" opacity="0.75"/>
    <circle cx="1060" cy="180" r="9" fill="#CFC3FF" opacity="0.75"/>
  </g>
</svg>
